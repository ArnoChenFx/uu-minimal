name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  version:
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version tag
        id: version
        run: |
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$latest" ]; then
            ver="0.1.0"
          else
            ver="$(echo "${latest#v}" | awk -F. '{printf "%s.%s.%s", $1, $2, $3+1}')"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: glibc
            runner: ubuntu-22.04
            target: ""
            artifact: uu-minimal-glibc
            bin: uu-minimal
            apt: ""
          - id: musl
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact: uu-minimal
            bin: uu-minimal
            apt: musl-tools
          - id: windows
            runner: ubuntu-22.04
            target: x86_64-pc-windows-gnu
            artifact: uu-minimal.exe
            bin: uu-minimal.exe
            apt: mingw-w64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"
      - name: Install cross toolchain packages
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target "${{ matrix.target }}"
            src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          else
            cargo build --release --locked
            src="target/release/${{ matrix.bin }}"
          fi
          install -D -m 0755 "$src" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: uu-minimal*
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum uu-minimal uu-minimal-glibc uu-minimal.exe | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            uu-minimal
            uu-minimal-glibc
            uu-minimal.exe
            SHA256SUMS
